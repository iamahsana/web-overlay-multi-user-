<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}.wl{display:flex;align-items:center;gap:22px;padding:14px 22px;border-radius:16px;background:#111c;color:white;text-align:center;text-shadow:0 2px 5px #0008}.score{font-size:42px;font-weight:900;line-height:1}.name{font-size:16px;font-weight:700}.label{font-size:11px;letter-spacing:2px;opacity:.8}.txt{white-space:pre-wrap;max-width:100vw;padding:8px;text-align:center;line-height:1.2}</style></head><body><div id="view">Memuat overlay…</div><script>
const id='<?= overlayId ?>',type='<?= overlayType ?>';
function load(){google.script.run.withSuccessHandler(r=>{if(!r.ok){document.getElementById('view').textContent='Overlay tidak tersedia';return}render(r.data)}).api('', 'getOverlay',{id,type})}
function render(o){let d=o.data,v=document.getElementById('view');if(type==='wl'){v.innerHTML='<div class="wl" style="border:2px solid '+safe(d.color||'#62e6a7')+'"><div><div class="label">WIN</div><div class="score" style="color:'+safe(d.color||'#62e6a7')+'">'+Number(d.wins||0)+'</div></div><div><div class="name">'+esc(d.player||d.title||'PLAYER')+'</div><div class="label">'+esc(d.title||'MATCH SCORE')+'</div></div><div><div class="label">LOSS</div><div class="score">'+Number(d.losses||0)+'</div></div></div>'}else{v.className='txt';v.textContent=d.content||'';v.style.cssText='white-space:pre-wrap;max-width:100vw;padding:8px;text-align:'+safe(d.align||'center')+';font-family:'+safe(d.font||'Arial')+';font-size:'+Math.min(160,Math.max(8,Number(d.size||36)))+'px;font-weight:'+Number(d.weight||700)+';color:'+safe(d.color||'#fff')+';-webkit-text-stroke:'+Math.min(10,Math.max(0,Number(d.stroke||0)))+'px '+safe(d.outline||'#111827')+';text-shadow:'+(d.shadow?'0 2px 8px #000':'none')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safe(s){return String(s||'').replace(/[^#(),.%\w\s-]/g,'')}load();setInterval(load,2500);
</script></body></html>
